version: "2"
run:
  timeout: 5m
  go: 1.27.1
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - noinlineerr
  settings:
    cyclop:
      max-complexity: 20
    exhaustruct_v5:
      # This codebase constructs structs zero-value-first; partial literals
      # are intentional for every type listed here.
      ignore-patterns:
        - os/exec\.Cmd
        - github.com/LarsArtmann/emeet-pixyd\.CommandResult
        - github.com/LarsArtmann/emeet-pixyd\.CommandError
        - github.com/LarsArtmann/emeet-pixyd\.Daemon
        - github.com/LarsArtmann/emeet-pixyd\.Dependencies
        - github.com/LarsArtmann/emeet-pixyd\.webStatus
        - github.com/LarsArtmann/emeet-pixyd\.statusRecorder
        - github.com/LarsArtmann/emeet-pixyd\.streamResult
        - github.com/LarsArtmann/emeet-pixyd\.uevent
        - github.com/LarsArtmann/emeet-pixyd\.warnLimiter
        - github.com/LarsArtmann/emeet-pixyd\.Broadcaster
        - github.com/LarsArtmann/emeet-pixyd/internal/pixy\.Config
        - github.com/LarsArtmann/emeet-pixyd/internal/pixy\.PTZValues
        - net\.Dialer
        - net\.ListenConfig
        - net/http\.Server
        - golang.org/x/sys/unix\.SockaddrNetlink
    funlen:
      lines: 100
      statements: 80
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 25
    goconst:
      ignore-tests: true
      min-len: 4
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 20
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G104
        - G107
        - G115
        - G204
        - G301
        - G304
        - G306
        - G702
        - G703
        - G706
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
        - github.com/LarsArtmann/emeet-pixyd.HIDDevice
    makezero:
      always: false
    mnd:
      ignored-numbers:
        - "2"
    nestif:
      min-complexity: 6
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    tagalign:
      align: false
      order:
        - binding
        - json
        - yaml
        - xml
        - toml
        - validate
        - mapstructure
      sort: true
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
        - d
        - d2
        - s
        - r
        - br
        - ch
        - f
        - fd
        - "n"
        - tc
        - rm
        - w
        - ep
        - c
        - id
      ignore-type-assert-ok: true
    wrapcheck:
      ignore-sig-regexps:
        - encoding/json
        - fmt\.
        - errors\.
        - slices\.
        - maps\.
        - sort\.
        - time\.
        - net/http
        - os\.
        - io\.
        - strings\.
        - strconv\.
        - path\.
        - filepath\.
        - compress/gzip
        - \(context\.Context\)\.Err
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - exhaustruct_v5
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
          - err113
          - noinlineerr
          - forcetypeassert
          - gosec
          - errcheck
          - wrapcheck
          - ireturn
          - recvcheck
          - contextcheck
          - exhaustive
      - path: _test\.go
        text: unused
        linters:
          - unused
      - path: ^main\.go$
        text: package has more than one godoc
        linters:
          - godoclint
    paths:
      - \./
      - \.gen\.go$
      - _templ\.go$
      - fake_.*\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - \./
      - _templ\.go$
      - fake_.*\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
