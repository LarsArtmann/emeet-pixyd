version: "2"
run:
    timeout: 5m
    go: 1.26.3
    build-tags:
        - goexperiment.arenas
        - goexperiment.goroutineleakprofile
        - goexperiment.jsonv2
        - goexperiment.runtimesecret
        - goexperiment.simd
    allow-parallel-runners: true
    allow-serial-runners: true
    issues-exit-code: 1
    tests: true
output:
    formats: {}
linters:
    enable:
        - bodyclose
        - contextcheck
        - copyloopvar
        - cyclop
        - dupl
        - durationcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - forcetypeassert
        - funlen
        - ginkgolinter
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - gosec
        - gosmopolitan
        - interfacebloat
        - intrange
        - loggercheck
        - maintidx
        - mirror
        - misspell
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - noctx
        - nolintlint
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - testifylint
        - thelper
        - unconvert
        - unparam
        - usetesting
        - wastedassign
        - wrapcheck
        - zerologlint
    settings:
        cyclop:
            max-complexity: 20
        exhaustruct:
            exclude:
                - os/exec.Cmd
        funlen:
            lines: 100
            statements: 80
        gocritic:
            disabled-checks:
                - ifElseChain
        gosec:
            excludes:
                - G104
                - G107
                - G115
                - G204
                - G301
                - G304
                - G306
                - G702
                - G706
        revive:
            rules:
                - disabled: true
                  name: exported
                - disabled: true
                  name: package-comments
    exclusions:
        generated: lax
        rules:
            - path: _test\.go
              linters:
                - exhaustruct
                - testpackage
                - gochecknoglobals
                - funlen
                - cyclop
                - goconst
            - path: _test\.go
              text: unused
              linters:
                - unused
        paths:
            - \.gen\.go$
            - _templ\.go$
            - vendor/
formatters:
    enable:
        - gci
        - goimports
        - gofumpt
        - golines
    settings:
        golines:
            max-len: 120
    exclusions:
        generated: lax
        paths:
            - _templ\.go$
issues:
    max-issues-per-linter: 50
    max-same-issues: 10
