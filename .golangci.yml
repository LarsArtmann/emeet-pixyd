version: "2"
run:
    timeout: 5m
    go: 1.26.2
    build-tags:
        - goexperiment.arenas
        - goexperiment.goroutineleakprofile
        - goexperiment.jsonv2
        - goexperiment.runtimesecret
        - goexperiment.simd
    allow-parallel-runners: true
    allow-serial-runners: true
    issues-exit-code: 1
    tests: true
output:
    formats: {}
linters:
    disable:
        - dupl
        - exhaustive
        - ginkgolinter
        - gochecksumtype
        - gocognit
        - gocyclo
        - interfacebloat
        - intrange
        - maintidx
        - mirror
        - misspell
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnil
        - perfsprint
        - predeclared
        - protogetter
        - reassign
        - recvcheck
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - testifylint
        - unconvert
        - usetesting
        - wastedassign
        - wrapcheck
        - zerologlint
issues:
    max-issues-per-linter: 50
    max-same-issues: 10
    exclude-rules:
        # contextcheck: templ component calls don't propagate context to components
        - linters:
            - contextcheck
          path: "handlers.go"
          text: "should pass the context parameter"

        # exhaustruct: partial struct initialization is idiomatic for configs/tests
        - linters:
            - exhaustruct
          path: "_test.go$"

        # exhaustruct: partial initialization is idiomatic for daemon/config structs
        - linters:
            - exhaustruct
          path: "(handlers|main|state|probe|v4l2|uevent|uevent_linux)\\.go"

        # paralleltest: test files may intentionally skip t.Parallel()
        - linters:
            - paralleltest
          path: "_test.go$"

        # noctx: test helpers may use http.Get/Post without context
        - linters:
            - noctx
          path: "_test.go$"

        # errcheck: resp.Body.Close() in test cleanup — errors are harmless
        - linters:
            - errcheck
          path: "_test.go$"
          text: 'Error return value of.*resp\.Body\.Close'

        # errcheck: os.RemoveAll in test cleanup — errors are harmless
        - linters:
            - errcheck
          path: "_test.go$"
          text: 'Error return value of.*os\.RemoveAll'

        # errcheck: w.Write in test handler — errors are harmless
        - linters:
            - errcheck
          path: "_test.go$"
          text: 'Error return value of.*w\.Write'

linters-settings:
    gosec:
        excludes:
            - G304
            - G204
            - G706
            - G115
    cyclop:
        max-complexity: 20
    funlen:
        max: 80
        min-lines: 1
