version: "2"
run:
  timeout: 5m
  go: 1.26.2
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - bodyclose
    - copyloopvar
    - cyclop
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - forcetypeassert
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gosec
    - gosmopolitan
    - loggercheck
    - nilnesserr
    - nolintlint
    - prealloc
    - revive
    - thelper
    - unparam
  settings:
    cyclop:
      max-complexity: 20
    funlen:
      lines: 100
      statements: 80
    gosec:
      excludes:
        - G104
        - G107
        - G115
        - G204
        - G301
        - G304
        - G306
        - G702
        - G706
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
