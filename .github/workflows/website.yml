name: Website build

on:
  push:
    branches: [master]
    paths:
      - website/**
      - .github/workflows/website.yml
  pull_request:
    branches: [master]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version pinned via packageManager in package.json)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # Frozen install doubles as the lockfile-drift guard: any manifest
      # change without a regenerated lockfile fails here, not at deploy time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (astro + CSP hash patch)
        run: pnpm run build

      - name: Verify output
        run: |
          pages=$(find dist -name '*.html' | wc -l)
          echo "Built $pages HTML files"
          if [ "$pages" -lt 19 ]; then
            echo "ERROR: expected at least 19 HTML files (18 pages + 404), got $pages"
            exit 1
          fi

  # Deploys only when the FIREBASE_SERVICE_ACCOUNT secret exists (setup
  # checklist: FIREBASE_DEPLOY_SETUP.md). Until then the job self-skips and
  # deploys stay manual (firebase deploy from website/, see AGENTS.md).
  deploy:
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for deploy secret
        id: secret
        env:
          HAS_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: echo "present=$HAS_SECRET" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm (version pinned via packageManager in package.json)
        if: steps.secret.outputs.present == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.secret.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build (astro + CSP hash patch)
        if: steps.secret.outputs.present == 'true'
        run: pnpm run build

      # Stale-deploy incident rule: verify the freshly built changelog page
      # contains the newest documented section BEFORE uploading. If the site's
      # changelog is restructured, update this sentinel alongside it.
      - name: Verify changelog content
        if: steps.secret.outputs.present == 'true'
        run: grep -q "Corrections from official-app evidence" dist/changelog/index.html

      - name: Deploy to Firebase Hosting
        if: steps.secret.outputs.present == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting:emeet-pixyd --project lars-software
