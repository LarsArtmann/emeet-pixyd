name: Go tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOPRIVATE: github.com/larsartmann/*,github.com/LarsArtmann/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Vet
        run: go vet ./...

      - name: Generate templ
        run: |
          go install github.com/a-h/templ/cmd/templ@latest
          templ generate

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout 2m

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test with coverage
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: testdata/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: |
          for target in FuzzExtractJPEGFrame FuzzParseHIDResponse; do
            echo "Fuzzing $target for 60s ..."
            go test -fuzz=$target -fuzztime=60s .
          done
