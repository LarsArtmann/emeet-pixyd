name: Go tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Generate templ
        run: |
          # Pin templ version to match go.mod and nix pkgs.templ (prevents drift)
          TEMPL_VERSION=$(grep 'a-h/templ' go.mod | awk '{print $2}')
          go install github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}
          echo "Using templ $(templ version)"
          templ generate
          # Validate generated files are non-empty (guards against templ intermittently
          # emitting a zero-byte *_templ.go, which has caused silent CI breaks).
          for f in *_templ.go; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty after templ generate — re-running"
              templ generate
              if [ ! -s "$f" ]; then
                echo "FATAL: $f still empty after retry"
                exit 1
              fi
            fi
          done

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout 2m

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test with coverage
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          # Enforce minimum coverage (70% root package threshold)
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc)" -eq 1 ]; then
            echo "ERROR: Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

      - name: Nix flake check
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: nix --extra-experimental-features 'nix-command flakes' flake check

      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: testdata/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: |
          for target in FuzzExtractJPEGFrame FuzzParseHIDResponse FuzzParsePTZValue FuzzWriteSSEEvent; do
            echo "Fuzzing $target for 60s ..."
            go test -fuzz=$target -fuzztime=60s .
          done
