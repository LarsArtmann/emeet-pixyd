name: Go tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templ
        run: |
          # Pin templ version to match go.mod and nix pkgs.templ (prevents drift)
          TEMPL_VERSION=$(grep 'a-h/templ' go.mod | awk '{print $2}')
          go install github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}
          echo "Using templ $(templ version)"
          templ generate
          # Validate generated files are non-empty (guards against templ intermittently
          # emitting a zero-byte *_templ.go, which has caused silent CI breaks).
          for f in *_templ.go; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty after templ generate — re-running"
              templ generate
              if [ ! -s "$f" ]; then
                echo "FATAL: $f still empty after retry"
                exit 1
              fi
            fi
          done

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout 2m

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test with coverage
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          # Enforce minimum coverage (70% root package threshold)
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc)" -eq 1 ]; then
            echo "ERROR: Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

      - name: Cache fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: |
          for target in FuzzExtractJPEGFrame FuzzParseHIDResponse FuzzParsePTZValue FuzzReadSignals FuzzHandleConfigAndCommit; do
            echo "Fuzzing $target for 60s ..."
            go test -fuzz=$target -fuzztime=60s .
          done
